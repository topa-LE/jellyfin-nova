name: Jellyfin Nova Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate Nova
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build Nova distribution
        run: node scripts/build-nova.mjs

      - name: Run tests
        run: npm run check

      - name: Create installation package
        run: |
          tar -czf jellyfin-nova-package.tar.gz -C dist .

      - name: Validate installation package
        run: |
          tar -tzf jellyfin-nova-package.tar.gz > /dev/null
          tar -xOzf jellyfin-nova-package.tar.gz ./nova.css | cmp -s - dist/nova.css
          grep -Fq -- '--nova-accent' dist/nova.css

      - name: Upload Nova distribution
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-nova-distribution
          path: |
            dist/
            jellyfin-nova-package.tar.gz
          retention-days: 30

      - name: Publish latest Nova release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "$GITHUB_SHA" > nova-commit.txt
          if gh release view nova-latest >/dev/null 2>&1; then
            gh release upload nova-latest \
              jellyfin-nova-package.tar.gz nova-commit.txt --clobber
          else
            gh release create nova-latest \
              jellyfin-nova-package.tar.gz nova-commit.txt \
              --target "$GITHUB_SHA" \
              --title "Jellyfin Nova - Latest Development Build" \
              --notes "Automatically generated from the latest successful main build." \
              --prerelease
          fi
