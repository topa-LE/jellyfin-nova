<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10151c">
    <meta name="description" content="Jellyfin Nova – A modern visual experience for Jellyfin.">
    <title>Jellyfin Nova</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #10151c;
            color: #e5e9ef;
        }

        main {
            padding: 32px;
            text-align: center;
        }

        h1 {
            font-size: clamp(2.5rem, 7vw, 5rem);
            margin-bottom: 12px;
        }

        p {
            color: #aab6c3;
            font-size: 1.15rem;
        }

        a {
            color: #dc9b66;
        }
    </style>
</head>
<body>
    <main>
        <h1>Jellyfin Nova</h1>
        <p>A new visual experience for Jellyfin.</p>
        <p>Our website is coming soon.</p>
        <p>
            <a href="https://github.com/topa-LE/jellyfin-nova">
                View on GitHub
            </a>
        </p>
    </main>
</body>
</html>
